name: degen_detox
description: A mobile-first digital wellbeing app for the crypto community.
publish_to: 'none'
version: 0.9.0+9

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  solana: ^0.31.2+1
  solana_mobile_client: ^0.1.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  bs58: ^1.0.2
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # 0.1.2 with Android activity-result and orderly disconnect fixes.
  solana_mobile_client:
    path: vendor/solana_mobile_client

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
