plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.degendetox.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Enable desugaring for flutter_local_notifications 17.x
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.degendetox.app"
        // flutter_local_notifications 17.x requires minSdk 21+; safe override.
        minSdk = Math.max((flutter.minSdkVersion as Integer), 21)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions "mode"
    productFlavors {
        qa {
            dimension "mode"
            applicationIdSuffix ".qa"
            resValue "string", "app_name", "Degen Detox QA"
        }
        production {
            dimension "mode"
            resValue "string", "app_name", "Degen Detox"
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

// Force older androidx versions compatible with Android Gradle Plugin 8.7.0
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.browser:browser:1.8.0'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Required by flutter_local_notifications 17.x for Java 8+ desugaring.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

flutter {
    source = "../.."
}
